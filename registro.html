<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta gratis | Kivhora</title>
<meta name="description" content="Crea tu cuenta gratis en Kivhora y empieza a mejorar tu velocidad lectora hoy mismo.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://kivhora.com/registro.html">
<link rel="icon" type="image/jpeg" href="nutria_logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="style-2.5d.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-side">
    <img src="nutria_logo.jpeg" alt="Kivhora, la nutria lectora" style="border-radius: 20px; object-fit: cover; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
    <h2>Empieza tu entrenamiento</h2>
    <p>En 30 segundos tendrás tu cuenta y podrás hacer el test de velocidad lectora.</p>
    <ul>
      <li>✅ Test de 60 segundos</li>
      <li>✅ 8 lecciones con quiz</li>
      <li>✅ Progreso y logros guardados</li>
    </ul>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Crear cuenta</h1>
      <p class="muted">Es gratis y no necesitas tarjeta.</p>
      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Nombre</label>
          <input class="input" type="text" id="name" autocomplete="name" placeholder="¿Cómo te llamas?" required minlength="2">
        </div>
        <div class="field">
          <label for="profileType">Soy...</label>
          <select class="input" id="profileType" required style="cursor:pointer; appearance: auto;">
            <option value="" disabled selected>Selecciona tu perfil</option>
            <option value="niño">Niño / Niña</option>
            <option value="adolescente">Adolescente</option>
            <option value="universitario">Universitario</option>
            <option value="profesor">Profesor / Docente</option>
          </select>
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input class="input" type="email" id="email" autocomplete="email" placeholder="tu@correo.com" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" type="password" id="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <label class="check" style="margin-bottom:14px">
          <input type="checkbox" id="terms" required> Acepto los términos y la política de privacidad.
        </label>
        <div class="msg" id="msg" role="alert" aria-live="polite"></div>
        <button class="btn-3d btn--block" type="submit">Crear mi cuenta</button>
      </form>
      <p class="hint" style="margin-top:16px">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="kiv-cloud.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    var form = document.getElementById('registerForm');
    var msg = document.getElementById('msg');
    var submit = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('name').value.trim();
      var profileType = document.getElementById('profileType').value;
      var email = document.getElementById('email').value.trim();
      var pass = document.getElementById('password').value;
      var terms = document.getElementById('terms').checked;

      if (name.length < 2) { msg.className = 'msg err'; msg.textContent = 'Escribe tu nombre.'; return; }
      if (!profileType) { msg.className = 'msg err'; msg.textContent = 'Selecciona un perfil.'; return; }
      if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) { msg.className = 'msg err'; msg.textContent = 'Escribe un correo válido.'; return; }
      if (pass.length < 6) { msg.className = 'msg err'; msg.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
      if (!terms) { msg.className = 'msg err'; msg.textContent = 'Debes aceptar los términos.'; return; }

      submit.disabled = true;
      msg.className = 'msg';
      msg.textContent = 'Creando tu cuenta…';

      KIV.register(name, profileType, email, pass).then(function (res) {
        if (!res.ok) {
          submit.disabled = false;
          msg.className = 'msg err';
          msg.textContent = res.error || 'No se pudo crear la cuenta.';
          return;
        }
        if (res.needsConfirmation) {
          msg.className = 'msg ok';
          msg.textContent = '¡Cuenta creada! Revisa tu correo y confirma tu cuenta para entrar.';
          form.reset();
          submit.disabled = false;
          return;
        }
        msg.className = 'msg ok';
        msg.textContent = '¡Cuenta creada! Vamos al test…';
        window.location.href = 'exam.html';
      }).catch(function () {
        submit.disabled = false;
        msg.className = 'msg err';
        msg.textContent = 'No se pudo conectar con el servidor. Inténtalo de nuevo.';
      });
    });
  })();
</script>
</body>
</html>
